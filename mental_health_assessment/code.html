<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WellMind AI - Mental Health Assessment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#00201d",
                        "on-surface": "#191c1e",
                        "background": "#f7f9fb",
                        "on-secondary-container": "#3a6d66",
                        "outline-variant": "#c1c7ce",
                        "tertiary": "#34424a",
                        "surface": "#f7f9fb",
                        "tertiary-container": "#4b5962",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eceef0",
                        "on-tertiary-container": "#c0cfda",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "surface-tint": "#356382",
                        "on-primary-fixed": "#001e2f",
                        "on-background": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#9fccf0",
                        "surface-container-low": "#f2f4f6",
                        "on-primary": "#ffffff",
                        "primary-container": "#2d5b7a",
                        "on-primary-container": "#a5d2f6",
                        "inverse-primary": "#9fccf0",
                        "on-tertiary-fixed-variant": "#3b4951",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary-fixed-variant": "#194f49",
                        "primary": "#0f4361",
                        "outline": "#72787e",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#d6e5ef",
                        "surface-dim": "#d8dadc",
                        "surface-bright": "#f7f9fb",
                        "on-primary-fixed-variant": "#194b69",
                        "on-tertiary-fixed": "#0f1d25",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#cae6ff",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed-dim": "#bac9d3",
                        "inverse-on-surface": "#eff1f3",
                        "on-surface-variant": "#41474d",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#b7ede4",
                        "secondary-fixed-dim": "#9cd1c8",
                        "secondary": "#346760",
                        "secondary-container": "#b7ede4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "xl": "64px",
                        "gutter": "24px",
                        "sm": "12px",
                        "base": "8px",
                        "xs": "4px",
                        "container-max": "1200px",
                        "lg": "40px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "headline-xl": ["Manrope"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "14px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #f7f9fb; }
        .ambient-shadow { box-shadow: 0px 4px 20px rgba(45, 91, 122, 0.05); }
        .radio-custom:checked + div {
            background-color: #b7ede4; /* secondary-container */
            border-color: #346760; /* secondary */
        }
        .radio-custom:checked + div span {
            color: #00201d; /* on-secondary-fixed */
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">
<!-- Note: TopNav and SideNav are suppressed as this is a focused task/assessment page with linear flow (Back/Close actions implied) -->
<header class="w-full py-md px-md md:px-gutter flex items-center justify-between bg-surface shadow-sm max-w-container-max mx-auto">
<div class="flex items-center gap-sm cursor-pointer" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary text-[24px]">close</span>
<span class="font-label-md text-label-md text-primary">Exit Assessment</span>
</div>
<div class="font-headline-md text-headline-md text-primary font-bold">WellMind AI</div>
<div class="w-24"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-lg w-full max-w-container-max mx-auto">
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-[16px] ambient-shadow p-lg">
<!-- Progress Section -->
<div class="mb-xl">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Question 3 of 7</span>
<span class="font-label-md text-label-md text-primary font-bold">42%</span>
</div>
<div class="w-full bg-surface-container-high rounded-full h-[8px] overflow-hidden">
<div class="bg-secondary h-full rounded-full transition-all duration-500 ease-in-out" style="width: 42%;"></div>
</div>
</div>
<!-- Question Context -->
<div class="text-center mb-xl">
<p class="font-body-md text-body-md text-on-surface-variant mb-sm">Over the last 2 weeks, how often have you been bothered by the following problem?</p>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary text-balance">
                    Feeling nervous, anxious or on edge
                </h1>
</div>
<!-- Likert Scale Options -->
<div class="flex flex-col gap-sm mb-xl">
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only peer" name="gad7_q3" type="radio" value="0"/>
<div class="w-full border-2 border-outline-variant rounded-lg p-md flex items-center justify-between transition-colors duration-200 hover:bg-surface-container-low peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2 bg-surface-container-lowest">
<span class="font-body-lg text-body-lg text-on-surface transition-colors duration-200">Not at all</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only peer" name="gad7_q3" type="radio" value="1"/>
<div class="w-full border-2 border-outline-variant rounded-lg p-md flex items-center justify-between transition-colors duration-200 hover:bg-surface-container-low peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2 bg-surface-container-lowest">
<span class="font-body-lg text-body-lg text-on-surface transition-colors duration-200">Several days</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only peer" name="gad7_q3" type="radio" value="2"/>
<div class="w-full border-2 border-outline-variant rounded-lg p-md flex items-center justify-between transition-colors duration-200 hover:bg-surface-container-low peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2 bg-surface-container-lowest">
<span class="font-body-lg text-body-lg text-on-surface transition-colors duration-200">More than half the days</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only peer" name="gad7_q3" type="radio" value="3"/>
<div class="w-full border-2 border-outline-variant rounded-lg p-md flex items-center justify-between transition-colors duration-200 hover:bg-surface-container-low peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2 bg-surface-container-lowest">
<span class="font-body-lg text-body-lg text-on-surface transition-colors duration-200">Nearly every day</span>
</div>
</label>
</div>
<!-- Navigation Buttons -->
<div class="flex justify-between items-center mt-xl pt-lg border-t border-outline-variant/30">
<button class="flex items-center gap-xs px-md py-sm rounded-full text-primary font-label-md text-label-md hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
                    Back
                </button>
<button class="flex items-center gap-xs px-lg py-sm rounded-full bg-primary text-on-primary font-label-md text-label-md hover:bg-primary/90 transition-colors">
                    Next
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
